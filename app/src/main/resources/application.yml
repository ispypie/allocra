# Default configuration. Environment-specific overrides live in application-<profile>.yml.
# Everything sensitive/environment-specific is driven by environment variables (12-factor,
# Cloud Run compatible — PRD-NFR-002).
spring:
  application:
    name: allocra
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/allocra}
    username: ${SPRING_DATASOURCE_USERNAME:allocra}
    password: ${SPRING_DATASOURCE_PASSWORD:allocra}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}          # Cloud Run injects PORT
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true          # exposes /actuator/health/liveness and /readiness (PRD-NFR-003)
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
