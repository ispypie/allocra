name: allocra-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: allocra
      POSTGRES_USER: allocra
      POSTGRES_PASSWORD: allocra
    volumes:
      - allocra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allocra -d allocra"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # Builds the production image from the repo-root Dockerfile.
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 'demo' profile activates seeding + the cheat sheet (see `docker compose logs app`).
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/allocra
      SPRING_DATASOURCE_USERNAME: allocra
      SPRING_DATASOURCE_PASSWORD: allocra
      ALLOCRA_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  allocra_pgdata:
